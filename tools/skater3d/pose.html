<script type="module">

}
function cam(){const e=46*Math.PI/180; const c=new THREE.OrthographicCamera(-1.84,1.84,1.84,-1.84,.1,50); c.position.set(0,Math.sin(e)*8,Math.cos(e)*8); c.lookAt(0,0,0); c.position.y+=0; c.lookAt(0,0.0,0); c.zoom=1;
