const SKIN=new THREE.MeshStandardMaterial({color:window.SKINC||0xe0a27c,roughness:.6});
const SKIN2=new THREE.MeshStandardMaterial({color:0xd08f68,roughness:.78});
// A closed fist in its own frame: X = forward (knuckles), Y = up (thumb on top), Z = toward the camera (curled fingers).
// Sculpted as ONE smooth surface (a signed-distance field, polygonised once), modelled on a photo of a real fist:
// the thumb grows out of the fleshy pad at the base of the palm and lies along the top, tip flush with the knuckles;
// the four curled fingers are rounded segments that melt into the palm, with creases between them.
const sdCap=(p,a,b,r)=>{ const pa=[p[0]-a[0],p[1]-a[1],p[2]-a[2]], ba=[b[0]-a[0],b[1]-a[1],b[2]-a[2]]; const h=Math.max(0,Math.min(1,(pa[0]*ba[0]+pa[1]*ba[1]+pa[2]*ba[2])/(ba[0]*ba[0]+ba[1]*ba[1]+ba[2]*ba[2])));

const sdRBox=(p,c,h,rr)=>{ const q=[Math.abs(p[0]-c[0])-h[0]+rr,Math.abs(p[1]-c[1])-h[1]+rr,Math.abs(p[2]-c[2])-h[2]+rr]; return Math.hypot(Math.max(q[0],0),Math.max(q[1],0),Math.max(q[2],0))+Math.min(Math.max(q[0],q[1],q[2]),0)-rr; };

const FG=window.FG||{};
function fistSDF(p){

  let hand=sdRBox(p,[.044,-.012,-.014],[.036,.05,.027],.022);

  // four fat curled fingers stacked tight, index right under the thumb; hard union leaves deep creases between them
  const fing=Math.min(sdCap(p,[.064,.024,.024],[.098,.024,.026],.0172),sdCap(p,[.062,-.004,.026],[.1,-.004,.028],.0176),

let FIST_GEO=null;
function fistGeo(){ if(FIST_GEO) return FIST_GEO;
